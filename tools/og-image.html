<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Liberation Sans", Helvetica, Arial, sans-serif;
    color: #fff;
    background: #062e38;
  }
  svg.road { position: absolute; inset: 0; }
  .copy { position: absolute; left: 90px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 72px; height: 72px; }
  .brand b { font-size: 48px; letter-spacing: -1.5px; color: #b9dfe8; }
  h1 { margin-top: 40px; font-size: 104px; line-height: 1; letter-spacing: -4px; }
</style>
<body>
<svg class="road" width="1200" height="630" viewBox="0 0 1200 630">
  <path d="M 800 700 L 800 440 C 800 340 860 300 960 300 L 1260 300" fill="none" stroke="#0e4452" stroke-width="150"/>
  <path d="M 800 700 L 800 440 C 800 340 860 300 960 300 L 1260 300" fill="none" stroke="#30b0c7" stroke-width="5" stroke-dasharray="28 24"/>
</svg>
<div class="copy">
  <div class="brand">
    <svg viewBox="0 0 64 64"><defs><clipPath id="t"><rect width="64" height="64" rx="14"/></clipPath></defs><g clip-path="url(#t)"><rect width="64" height="64" fill="#30B0C7"/><path d="M26 72V40A16 16 0 0 1 42 24H72" fill="none" stroke="#062E38" stroke-width="18"/><circle cx="26" cy="50" r="6.8" fill="#fff"/></g></svg>
    <b>RydAR</b>
  </div>
  <h1>Safe<br>Driving.</h1>
</div>
</body>
